<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Heart Attack Prediction</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Heart Attack Prediction</h1>

      <p class="description">
        Enter the patient's health information to get a machine learning
        prediction.
      </p>

      <form id="predictionForm">
        <!-- Age -->
        <div class="form-group">
          <label for="age">Age</label>
          <input
            type="number"
            id="age"
            name="age"
            placeholder="Enter age"
            min="1"
            required
          />
        </div>

        <!-- Gender -->
        <div class="form-group">
          <label for="gender">Gender</label>
          <select id="gender" name="gender" required>
            <option value="">Select gender</option>
            <option value="0">Female</option>
            <option value="1">Male</option>
          </select>
        </div>

        <!-- Heart Rate -->
        <div class="form-group">
          <label for="heartRate">Heart Rate</label>
          <input
            type="number"
            id="heartRate"
            name="heartRate"
            placeholder="Enter heart rate"
            min="1"
            required
          />
        </div>

        <!-- Systolic Blood Pressure -->
        <div class="form-group">
          <label for="systolicBP">Systolic Blood Pressure</label>
          <input
            type="number"
            id="systolicBP"
            name="systolicBP"
            placeholder="Enter systolic blood pressure"
            min="1"
            required
          />
        </div>

        <!-- Diastolic Blood Pressure -->
        <div class="form-group">
          <label for="diastolicBP">Diastolic Blood Pressure</label>
          <input
            type="number"
            id="diastolicBP"
            name="diastolicBP"
            placeholder="Enter diastolic blood pressure"
            min="1"
            required
          />
        </div>

        <!-- Blood Sugar -->
        <div class="form-group">
          <label for="bloodSugar">Blood Sugar</label>
          <input
            type="number"
            id="bloodSugar"
            name="bloodSugar"
            placeholder="Enter blood sugar level"
            step="any"
            min="0"
            required
          />
        </div>

        <!-- CK-MB -->
        <div class="form-group">
          <label for="ckmb">CK-MB</label>
          <input
            type="number"
            id="ckmb"
            name="ckmb"
            placeholder="Enter CK-MB value"
            step="any"
            min="0"
            required
          />
        </div>

        <!-- Troponin -->
        <div class="form-group">
          <label for="troponin">Troponin</label>
          <input
            type="number"
            id="troponin"
            name="troponin"
            placeholder="Enter Troponin value"
            step="any"
            min="0"
            required
          />
        </div>

        <!-- Submit Button -->
        <button type="submit">Predict</button>
      </form>

      <!-- Prediction Result -->
      <div id="result" class="result">
        <!-- Prediction result will appear here -->
      </div>

      <p class="disclaimer">
        This project is for educational purposes only and is not a medical
        diagnosis.
      </p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
